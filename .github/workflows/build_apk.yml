name: Build APK TR4 IAW4AM

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.8'

      - name: Instalar dependencias Android e Build
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Configurar versoes estaveis no buildozer.spec
        run: |
          echo "" >> buildozer.spec
          echo "p4a.branch = v2024.01.21" >> buildozer.spec
          echo "android.ndk = 25b" >> buildozer.spec
          echo "android.accept_sdk_license = True" >> buildozer.spec

      - name: Compilar APK Android
        env:
          USE_OPENGL_ES2: "1"
          USE_SDL2: "1"
          KIVY_GRAPHICS: "gles"
        run: |
          yes | buildozer android debug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: TR4-IAW4AM-APK
          path: bin/*.apk
